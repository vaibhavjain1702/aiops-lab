<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Evaluation — AI DevOps Assistant</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary:#0f0f23;--bg-secondary:#1a1a3e;--bg-card:#1e1e45;--bg-input:#252550;
            --text-primary:#e8e8ff;--text-secondary:#a0a0d0;--text-muted:#6060a0;
            --accent-primary:#6366f1;--accent-secondary:#8b5cf6;--accent-success:#10b981;
            --accent-warning:#f59e0b;--accent-danger:#ef4444;--accent-info:#3b82f6;
            --border:#2a2a5e;--shadow:0 4px 24px rgba(0,0,0,0.4);--radius:12px;--radius-sm:8px;
        }
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:var(--bg-primary);color:var(--text-primary);min-height:100vh;}
        .nav{background:linear-gradient(135deg,var(--bg-secondary),var(--bg-card));border-bottom:1px solid var(--border);padding:0 2rem;display:flex;align-items:center;justify-content:space-between;height:64px;position:sticky;top:0;z-index:100;}
        .nav-brand{display:flex;align-items:center;gap:12px;font-weight:700;}
        .nav-brand .logo{width:36px;height:36px;background:linear-gradient(135deg,var(--accent-primary),#ec4899);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:1.2rem;}
        .nav-links{display:flex;gap:4px;}
        .nav-link{padding:8px 16px;border-radius:var(--radius-sm);color:var(--text-secondary);text-decoration:none;font-size:0.9rem;font-weight:500;}
        .nav-link:hover,.nav-link.active{background:var(--accent-primary);color:white;}
        .container{max-width:1400px;margin:0 auto;padding:2rem;}
        .card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.5rem;margin-bottom:1.5rem;box-shadow:var(--shadow);}
        .card-title{font-size:0.85rem;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted);margin-bottom:1rem;}
        .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem;}
        .form-group{display:flex;flex-direction:column;gap:6px;}
        .form-label{font-size:0.8rem;color:var(--text-muted);font-weight:500;}
        select,input[type="text"],textarea{background:var(--bg-input);border:1px solid var(--border);color:var(--text-primary);padding:10px 14px;border-radius:var(--radius-sm);font-family:inherit;font-size:0.9rem;outline:none;}
        select:focus,input:focus,textarea:focus{border-color:var(--accent-primary);box-shadow:0 0 0 3px rgba(99,102,241,0.2);}
        textarea{resize:vertical;min-height:80px;}
        .checkbox-group{display:flex;flex-wrap:wrap;gap:8px;}
        .checkbox-label{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--bg-input);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:0.85rem;transition:all 0.2s;}
        .checkbox-label:has(input:checked){background:var(--accent-primary);border-color:var(--accent-primary);color:white;}
        .checkbox-label input{display:none;}
        .toggle-container{display:flex;align-items:center;gap:8px;}
        .toggle{position:relative;width:52px;height:28px;background:var(--bg-input);border-radius:14px;cursor:pointer;border:1px solid var(--border);transition:all 0.3s;}
        .toggle.active{background:var(--accent-primary);border-color:var(--accent-primary);}
        .toggle::after{content:'';position:absolute;width:22px;height:22px;border-radius:50%;background:white;top:2px;left:2px;transition:all 0.3s;}
        .toggle.active::after{left:26px;}
        .btn{padding:10px 24px;border-radius:var(--radius-sm);border:none;font-family:inherit;font-weight:600;font-size:0.9rem;cursor:pointer;transition:all 0.3s;display:inline-flex;align-items:center;gap:8px;}
        .btn-primary{background:linear-gradient(135deg,var(--accent-primary),var(--accent-secondary));color:white;}
        .btn-primary:hover{transform:translateY(-1px);box-shadow:0 4px 16px rgba(99,102,241,0.4);}
        .btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none;}
        .results-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:1.5rem;margin-top:1.5rem;}
        .result-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:1.25rem;transition:all 0.3s;}
        .result-card:hover{border-color:var(--accent-primary);}
        .result-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
        .result-model{font-weight:700;font-size:1rem;}
        .result-status{padding:4px 10px;border-radius:12px;font-size:0.75rem;font-weight:600;}
        .status-success{background:rgba(16,185,129,0.15);color:var(--accent-success);}
        .status-error{background:rgba(239,68,68,0.15);color:var(--accent-danger);}
        .metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:1rem;}
        .metric-mini{background:var(--bg-input);border-radius:var(--radius-sm);padding:8px;text-align:center;}
        .metric-mini-value{font-size:1.1rem;font-weight:700;color:var(--accent-primary);}
        .metric-mini-label{font-size:0.65rem;color:var(--text-muted);}
        .result-answer{background:var(--bg-input);border-radius:var(--radius-sm);padding:1rem;font-size:0.85rem;color:var(--text-secondary);max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;}
        .result-sources{margin-top:0.75rem;}
        .source-chip{display:inline-flex;align-items:center;gap:4px;padding:4px 8px;background:rgba(59,130,246,0.1);border-radius:4px;font-size:0.75rem;color:var(--accent-info);margin:2px;}
        .summary-card{background:linear-gradient(135deg,var(--bg-card),var(--bg-secondary));border:1px solid var(--accent-primary);border-radius:var(--radius);padding:1.5rem;margin-top:1.5rem;}
        .loading{display:none;align-items:center;gap:12px;padding:2rem;justify-content:center;}
        .loading.visible{display:flex;}
        .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--accent-primary);border-radius:50%;animation:spin 0.8s linear infinite;}
        @keyframes spin{to{transform:rotate(360deg);}}
        @media(max-width:768px){.form-grid{grid-template-columns:1fr;}.results-grid{grid-template-columns:1fr;}}
    </style>
</head>
<body>
<nav class="nav">
    <div class="nav-brand"><div class="logo">🧪</div><span>Live Evaluation</span></div>
    <div class="nav-links">
        <a class="nav-link" href="/">🗨️ Assistant</a>
        <a class="nav-link" href="/evaluation">📊 Evaluation</a>
        <a class="nav-link active">🧪 Live Eval</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <div class="card-title">🧪 Targeted Live Evaluation</div>
        <p style="color:var(--text-secondary);margin-bottom:1.5rem;font-size:0.9rem;">
            Test one question across selected models without rerunning the full benchmark.
        </p>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label">Category</label>
                <select id="category">
                    <option>Explanation</option>
                    <option>Code Retrieval</option>
                    <option>Dependency Understanding</option>
                    <option>Bug Analysis</option>
                    <option>Code Generation</option>
                    <option>Refactoring</option>
                    <option>RAG based Question</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label">RAG & Top-K</label>
                <div style="display:flex;gap:1rem;align-items:center;">
                    <div class="toggle-container">
                        <div class="toggle active" id="ragToggle" onclick="this.classList.toggle('active')"></div>
                        <span style="font-size:0.85rem;">RAG</span>
                    </div>
                    <div>
                        <label class="form-label">Top-K: <span id="topKVal">5</span></label>
                        <input type="range" id="topK" min="1" max="15" value="5" style="width:100px;" oninput="document.getElementById('topKVal').textContent=this.value">
                    </div>
                </div>
            </div>
        </div>

        <div class="form-group" style="margin-top:1rem;">
            <label class="form-label">Question</label>
            <textarea id="question" placeholder="Enter evaluation question..."></textarea>
        </div>

        <div class="form-group" style="margin-top:1rem;">
            <label class="form-label">Reference Answer (optional)</label>
            <textarea id="reference" placeholder="Expected answer for correctness scoring..."></textarea>
        </div>

        <div class="form-group" style="margin-top:1rem;">
            <label class="form-label">Code Tests (for Code Generation / Refactoring — one per line)</label>
            <textarea id="codeTests" placeholder="assert function_name(2,3) == 5&#10;assert function_name(0,0) == 0"></textarea>
        </div>

        <div class="form-group" style="margin-top:1rem;">
            <label class="form-label">Models to Evaluate</label>
            <div class="checkbox-group">
                <label class="checkbox-label"><input type="checkbox" value="qwen2.5:3b" checked> qwen2.5:3b</label>
                <label class="checkbox-label"><input type="checkbox" value="starcoder2:3b" checked> starcoder2:3b</label>
                <label class="checkbox-label"><input type="checkbox" value="codellama:latest" checked> codellama:latest</label>
                <label class="checkbox-label"><input type="checkbox" value="mistral:latest" checked> mistral:latest</label>
            </div>
        </div>

        <button class="btn btn-primary" id="runBtn" onclick="runEval()" style="margin-top:1.5rem;">
            🚀 Run Live Evaluation
        </button>
    </div>

    <div class="loading" id="loading">
        <div class="spinner"></div>
        <span style="color:var(--text-secondary)">Evaluating across models...</span>
    </div>

    <!-- Results -->
    <div id="resultsArea"></div>
</div>

<script>
async function runEval() {
    const question = document.getElementById('question').value.trim();
    if (!question) { alert('Please enter a question'); return; }

    const category = document.getElementById('category').value;
    const rag = document.getElementById('ragToggle').classList.contains('active');
    const topK = parseInt(document.getElementById('topK').value);
    const reference = document.getElementById('reference').value.trim() || null;
    const codeTestsRaw = document.getElementById('codeTests').value.trim();
    const codeTests = codeTestsRaw ? codeTestsRaw.split('\n').filter(t => t.trim()) : null;
    const models = [...document.querySelectorAll('.checkbox-group input:checked')].map(i => i.value);

    if (!models.length) { alert('Select at least one model'); return; }

    document.getElementById('runBtn').disabled = true;
    document.getElementById('loading').classList.add('visible');
    document.getElementById('resultsArea').innerHTML = '';

    try {
        const resp = await fetch('/live/evaluate', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ category, question, models, rag, top_k: topK, reference_answer: reference, code_tests: codeTests })
        });
        const data = await resp.json();
        renderResults(data);
    } catch (e) {
        document.getElementById('resultsArea').innerHTML = `<div class="card" style="color:var(--accent-danger);">Error: ${e.message}</div>`;
    } finally {
        document.getElementById('runBtn').disabled = false;
        document.getElementById('loading').classList.remove('visible');
    }
}

function renderResults(data) {
    const area = document.getElementById('resultsArea');
    let html = '';

    // Summary card
    if (data.summary) {
        html += `<div class="summary-card">
            <div class="card-title">📊 Evaluation Summary</div>
            <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                <div><strong>Category:</strong> ${data.category}</div>
                <div><strong>RAG:</strong> ${data.rag ? '✅ ON' : '❌ OFF'}</div>
                <div><strong>Models Evaluated:</strong> ${data.summary.models_evaluated || 0}</div>
                <div><strong>Fastest:</strong> <span style="color:var(--accent-success)">${data.summary.fastest_model || '—'}</span></div>
                <div><strong>Best Correctness:</strong> <span style="color:var(--accent-primary)">${data.summary.best_correctness || '—'}</span></div>
                <div><strong>Lowest Hallucination:</strong> <span style="color:var(--accent-info)">${data.summary.lowest_hallucination || '—'}</span></div>
            </div>
        </div>`;
    }

    // Per-model results
    html += '<div class="results-grid">';
    const modelColors = { 'qwen2.5:3b': '#6366f1', 'starcoder2:3b': '#10b981', 'codellama:latest': '#f59e0b', 'mistral:latest': '#ec4899' };

    for (const [model, result] of Object.entries(data.model_results || {})) {
        const isError = result.status === 'error';
        const m = result.metrics || {};
        const t = result.telemetry || {};
        const color = modelColors[model] || '#6366f1';

        html += `<div class="result-card" style="border-top:3px solid ${color};">
            <div class="result-header">
                <span class="result-model">${model}</span>
                <span class="result-status ${isError ? 'status-error' : 'status-success'}">${result.status || 'unknown'}</span>
            </div>`;

        if (!isError) {
            html += `<div class="metrics-grid">
                <div class="metric-mini"><div class="metric-mini-value">${m.correctness?.score?.toFixed(2) || '—'}</div><div class="metric-mini-label">Correctness</div></div>
                <div class="metric-mini"><div class="metric-mini-value">${m.relevance?.score?.toFixed(2) || '—'}</div><div class="metric-mini-label">Relevance</div></div>
                <div class="metric-mini"><div class="metric-mini-value">${m.hallucination?.rate?.toFixed(2) || '—'}</div><div class="metric-mini-label">Hallucination</div></div>
                <div class="metric-mini"><div class="metric-mini-value">${t.latency_seconds?.toFixed(2) || '—'}</div><div class="metric-mini-label">Latency (s)</div></div>
                <div class="metric-mini"><div class="metric-mini-value">${t.total_tokens || '—'}</div><div class="metric-mini-label">Tokens</div></div>
                <div class="metric-mini"><div class="metric-mini-value">${t.generation_tok_per_sec?.toFixed(1) || '—'}</div><div class="metric-mini-label">Tok/s</div></div>
            </div>
            <div class="result-answer">${(result.answer || '').substring(0, 600)}</div>`;

            // Sources
            if (result.sources && result.sources.length) {
                html += `<div class="result-sources">`;
                result.sources.forEach(s => {
                    html += `<span class="source-chip">📄 ${s.document || '?'} (${(s.similarity * 100).toFixed(0)}%)</span>`;
                });
                html += `</div>`;
            }

            // Code tests
            if (result.code_tests && result.code_tests.status !== 'runner_unavailable') {
                html += `<div style="margin-top:0.75rem;padding:8px;background:var(--bg-input);border-radius:var(--radius-sm);">
                    <strong>Code Tests:</strong> ${result.code_tests.passed}/${result.code_tests.total} passed (${(result.code_tests.pass_rate * 100).toFixed(0)}%)
                </div>`;
            }

            // Guardrail
            const gr = result.guardrail?.output;
            if (gr) {
                const grColor = gr.passed ? 'var(--accent-success)' : 'var(--accent-danger)';
                html += `<div style="margin-top:0.5rem;font-size:0.8rem;color:${grColor};">
                    🛡️ Output Guard: ${gr.passed ? '✅ Passed' : '🚫 ' + gr.rule}
                </div>`;
            }
        } else {
            html += `<div style="color:var(--accent-danger);padding:1rem;">Error: ${result.error || 'Unknown error'}</div>`;
        }

        html += `</div>`;
    }
    html += '</div>';

    area.innerHTML = html;
}
</script>
</body>
</html>
